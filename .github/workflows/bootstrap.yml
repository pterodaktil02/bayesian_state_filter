name: Finish repository bootstrap

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate bootstrap parts
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path('.bootstrap').glob('missing.b64.part*')):
              s = p.read_text()
              bad = [(i, repr(ch)) for i, ch in enumerate(s) if not (ch.isascii() and (ch.isalnum() or ch in '+/=\r\n'))]
              print(p, 'len=', len(s), 'mod4=', len(s.replace('\n','').replace('\r','')) % 4, 'bad=', bad[:20])
          PY
          for p in .bootstrap/missing.b64.part*; do
            echo "checking $p"
            base64 -d "$p" >/dev/null
          done

      - name: Rebuild missing source files
        shell: bash
        run: |
          set -euxo pipefail
          cat .bootstrap/missing.b64.part* | base64 -d > /tmp/missing.tar.xz
          tar -xJf /tmp/missing.tar.xz
          rm -rf .bootstrap

      - name: Commit completed repository
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish Bayesian State Filter 0.2.1.6"
          git push
